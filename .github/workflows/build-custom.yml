
name: Build Custom Meshtastic Firmware

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - 'variants/**'
      - '.github/workflows/build-custom.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout firmware
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build T3-S3
        id: build
        uses: meshtastic/gh-action-firmware@main
        with:
          pio_platform: esp32s3
          pio_env: tlora-t3s3-v1
          pio_target: build

      - name: Download unified ESP32 OTA firmware
        run: |
          curl -fL \
            https://github.com/meshtastic/firmware/releases/latest/download/mt-esp32s3-ota.bin \
            -o release/mt-esp32s3-ota.bin

      - name: Upload complete firmware package
        uses: actions/upload-artifact@v4
        with:
          name: custom-meshtastic-firmware
          path: release/
          if-no-files-found: error
          retention-days: 7


name: Build Custom Meshtastic Firmware

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'variants/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout firmware
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build T3-S3
        uses: meshtastic/gh-action-firmware@main
        with:
          pio_platform: esp32s3
          pio_env: tlora-t3s3-v1
          pio_target: build

      - name: Upload firmware files
        uses: actions/upload-artifact@v4
        with:
          name: custom-meshtastic-firmware
          path: release/
          if-no-files-found: error
          retention-days: 7
